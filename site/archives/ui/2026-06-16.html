<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Paper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            display: ["Playfair Display", "Georgia", "serif"]
          },
          boxShadow: {
            paper: "0 28px 90px rgba(17, 24, 39, 0.12)",
            card: "0 18px 44px rgba(17, 24, 39, 0.10)"
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --ink: #111827;
      --muted: #667085;
      --line: rgba(17, 24, 39, .12);
      --paper: rgba(255, 255, 255, .88);
      --wash: #f4f1eb;
      --accent: #e94f37;
    }

    body {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .86), rgba(244, 241, 235, .92) 34rem),
        radial-gradient(circle at 16% 8%, rgba(233, 79, 55, .14), transparent 27rem),
        radial-gradient(circle at 86% 16%, rgba(28, 100, 242, .12), transparent 25rem),
        radial-gradient(circle at 70% 86%, rgba(20, 121, 95, .10), transparent 29rem),
        var(--wash);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(17, 24, 39, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 24, 39, .025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .55), transparent 75%);
    }

    .paper-grid {
      grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr);
    }

    .lead-card {
      grid-template-columns: 1fr;
    }

    .article-card {
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .96), rgba(251, 249, 245, .88));
      position: relative;
    }

    .article-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72);
    }

    .article-card:hover {
      border-color: rgba(233, 79, 55, .28);
    }

    .image-link {
      isolation: isolate;
      aspect-ratio: 16 / 10;
      display: block;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .72), rgba(232, 237, 244, .82));
    }

    .image-link::before {
      content: "";
      position: absolute;
      inset: -20px;
      z-index: 0;
      background-image: var(--article-image);
      background-position: center;
      background-size: cover;
      filter: blur(24px) saturate(1.04);
      opacity: 0;
      transform: scale(1.08);
      transition: opacity .2s ease;
    }

    .image-link::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(17, 24, 39, .10)),
        linear-gradient(135deg, rgba(255, 255, 255, .40), rgba(232, 237, 244, .34));
    }

    .image-link .article-image,
    .image-link > div {
      position: relative;
      z-index: 1;
    }

    .image-link.image-weird {
      display: grid;
      place-items: center;
      background: #e8edf4;
    }

    .image-link.image-weird::before {
      opacity: .48;
    }

    .image-link.image-weird .article-image {
      height: calc(100% - 28px);
      width: calc(100% - 28px);
      object-fit: contain;
      transform: none;
      border-radius: .5rem;
      box-shadow: 0 14px 32px rgba(17, 24, 39, .16);
    }

    .image-link.image-broken .article-image {
      display: none;
    }

    .active-tab {
      background: #111827;
      color: #ffffff;
      box-shadow: 0 12px 28px rgba(17, 24, 39, .16);
    }

    .theme-active {
      color: #111827;
    }

    .theme-active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    .no-scrollbar {
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .small-card {
      grid-template-columns: minmax(168px, .72fr) minmax(0, 1fr);
    }

    .article-card.text-only .image-link {
      display: none;
    }

    .lead-card.text-only {
      align-content: center;
    }

    .small-card.text-only {
      grid-template-columns: 1fr;
    }

    .small-card.text-only > div {
      padding-right: 0;
    }

    .small-card .image-link {
      aspect-ratio: 4 / 3;
    }

    .lead-card .image-link {
      aspect-ratio: 16 / 9;
    }

    #menu-toggle.menu-open .menu-line:nth-child(1) {
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
    }

    #menu-toggle.menu-open .menu-line:nth-child(2) {
      opacity: 0;
    }

    #menu-toggle.menu-open .menu-line:nth-child(3) {
      bottom: 50%;
      transform: translateY(50%) rotate(-45deg);
    }

    @media (max-width: 1024px) {
      .paper-grid,
      .lead-card,
      .small-card {
        grid-template-columns: 1fr;
      }

      .small-card .image-link {
        aspect-ratio: 16 / 10;
      }
    }

    @media (max-width: 768px) {
      .small-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="min-h-screen text-[#111827] antialiased">
  <header class="sticky top-0 z-30 border-b border-[#111827]/10 bg-white/78 backdrop-blur-2xl">
    <div class="mx-auto flex max-w-[1360px] items-center gap-3 px-5 py-4 sm:gap-5 sm:px-8 lg:px-12">
      <a href="#" class="shrink-0 font-display text-2xl leading-none text-[#111827] sm:mr-4 sm:text-4xl">Personal Paper</a>

      <nav class="hidden items-center gap-4 md:flex" aria-label="Primary">
        <button class="main-tab active-tab rounded-lg px-5 py-2.5 text-sm font-semibold transition" data-filter="home">Home</button>
      </nav>

      <div class="hidden h-9 w-px bg-[#111827]/12 md:block"></div>

      <nav id="theme-tabs" class="no-scrollbar -mx-5 hidden min-w-0 flex-1 items-center gap-3 overflow-x-auto px-5 md:mx-0 md:flex md:px-0" aria-label="Themes"></nav>

      <button id="menu-toggle" class="ml-auto grid h-11 w-11 place-items-center rounded-lg border border-[#111827]/12 bg-white/80 text-[#111827] shadow-[0_10px_24px_rgba(17,24,39,.08)] md:hidden" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <span class="relative block h-4 w-5">
          <span class="menu-line absolute left-0 top-0 h-0.5 w-5 rounded-full bg-current transition"></span>
          <span class="menu-line absolute left-0 top-1/2 h-0.5 w-5 -translate-y-1/2 rounded-full bg-current transition"></span>
          <span class="menu-line absolute bottom-0 left-0 h-0.5 w-5 rounded-full bg-current transition"></span>
        </span>
      </button>
    </div>

    <div id="mobile-menu" class="hidden border-t border-[#111827]/10 bg-white/95 px-5 pb-5 pt-3 shadow-paper md:hidden">
      <nav class="grid grid-cols-2 gap-2" aria-label="Mobile navigation">
        <button class="main-tab active-tab rounded-lg px-4 py-3 text-left text-base font-semibold transition" data-filter="home">Home</button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-[1360px] px-5 py-10 sm:px-8 lg:px-12 lg:py-12">
    <section class="mb-8 border-b border-[#111827]/10 pb-7 sm:mb-10 sm:flex sm:items-end sm:justify-between sm:gap-8">
      <div>
        <p id="kicker" class="text-xs font-black uppercase tracking-[0.18em] text-[#e94f37]">Home</p>
        <h1 class="mt-3 max-w-4xl text-4xl font-black leading-[0.98] sm:text-6xl">Five things worth reading now</h1>
      </div>
      <p id="count" class="mt-4 max-w-sm text-sm font-semibold leading-6 text-[#667085] sm:mt-0">A quiet front page for the links you actually want to open.</p>
    </section>

    <section id="articles" class="grid paper-grid gap-4 lg:gap-5" aria-live="polite"></section>
  </main>

  <template id="lead-template">
    <article class="article-card lead-card group grid overflow-hidden rounded-lg border border-[#111827]/12 shadow-paper transition duration-300 hover:-translate-y-1 hover:shadow-card">
      <a class="image-link relative overflow-hidden bg-[#e8edf4]" href="#" target="_blank" rel="noreferrer">
        <img class="article-image h-full w-full object-cover transition duration-500 group-hover:scale-[1.025]" src="" alt="" loading="lazy">
        <div class="absolute inset-0 bg-gradient-to-r from-black/15 to-transparent"></div>
      </a>
      <div class="flex min-w-0 flex-col p-6 sm:p-8 lg:p-9">
        <a class="source mb-5 truncate text-sm font-bold uppercase tracking-[0.14em] text-[#667085] hover:text-[#111827]" href="#" target="_blank" rel="noreferrer"></a>
        <a class="headline text-3xl font-black leading-[1.05] text-[#111827] transition hover:text-[#e94f37] sm:text-4xl xl:text-5xl" href="#" target="_blank" rel="noreferrer"></a>
        <p class="summary mt-5 text-base font-medium leading-7 text-[#667085] sm:text-lg sm:leading-8"></p>
        <div class="mt-7 flex flex-wrap items-center gap-3 text-sm font-semibold text-[#667085]">
          <span class="tag rounded-md px-3 py-2 font-bold"></span>
          <span class="date"></span>
        </div>
      </div>
    </article>
  </template>

  <template id="small-template">
    <article class="article-card small-card group grid gap-5 overflow-hidden rounded-lg border border-[#111827]/12 p-5 shadow-card transition duration-300 hover:-translate-y-1">
      <a class="image-link relative overflow-hidden rounded-md bg-[#e8edf4]" href="#" target="_blank" rel="noreferrer">
        <img class="article-image h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]" src="" alt="" loading="lazy">
      </a>
      <div class="flex min-w-0 flex-col justify-center py-0.5 pr-1">
        <a class="source mb-3 truncate text-xs font-bold uppercase tracking-[0.12em] text-[#667085] hover:text-[#111827]" href="#" target="_blank" rel="noreferrer"></a>
        <a class="headline text-xl font-black leading-[1.14] text-[#111827] transition hover:text-[#e94f37] lg:text-[1.35rem]" href="#" target="_blank" rel="noreferrer"></a>
        <div class="mt-4 flex flex-wrap items-center gap-3 text-xs font-semibold text-[#667085] sm:text-sm">
          <span class="tag rounded-md px-3 py-2 font-bold"></span>
          <span class="date"></span>
        </div>
      </div>
    </article>
  </template>

  <script>
    const newsletterData = {
      "generatedAt": "2026-06-16T16:22:32.658Z",
      "home": [],
      "themes": [
            {
                  "id": "ai-agentic",
                  "label": "AI / Agentic",
                  "articles": []
            },
            {
                  "id": "software-engineering-architecture",
                  "label": "Software Engineering / Architecture",
                  "articles": []
            },
            {
                  "id": "fc-barcelona",
                  "label": "FC Barcelona",
                  "articles": []
            },
            {
                  "id": "football",
                  "label": "Football",
                  "articles": []
            },
            {
                  "id": "algeria",
                  "label": "Algeria",
                  "articles": []
            },
            {
                  "id": "politics-geopolitics",
                  "label": "Politics / Geopolitics",
                  "articles": []
            },
            {
                  "id": "general-news",
                  "label": "General News",
                  "articles": []
            },
            {
                  "id": "france-paris-local",
                  "label": "France / Paris Local",
                  "articles": []
            }
      ]
};

    const articlesEl = document.querySelector("#articles");
    const leadTemplate = document.querySelector("#lead-template");
    const smallTemplate = document.querySelector("#small-template");
    const kicker = document.querySelector("#kicker");
    const count = document.querySelector("#count");
    const menuToggle = document.querySelector("#menu-toggle");
    const mobileMenu = document.querySelector("#mobile-menu");
    const themeTabs = document.querySelector("#theme-tabs");
    const mobileNav = document.querySelector("#mobile-menu nav");
    let tabs = [];

    function createThemeButton(theme, mobile = false) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.filter = theme.id;
      button.textContent = theme.label;
      button.className = mobile
        ? "theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#111827]/90 transition hover:bg-[#111827]/5"
        : "theme-tab relative px-4 py-3 text-sm font-semibold text-[#475467] transition hover:text-[#111827] after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#e94f37] after:opacity-0 after:transition";
      return button;
    }

    function setupTabs() {
      newsletterData.themes.forEach((theme) => {
        themeTabs?.appendChild(createThemeButton(theme));
        mobileNav?.appendChild(createThemeButton(theme, true));
      });

      tabs = [...document.querySelectorAll("[data-filter]")];
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const filter = tab.dataset.filter;
          setActive(filter);
          render(filter);
          setMenuOpen(false);
        });
      });
    }

    function applyArticle(node, article) {
      const links = node.querySelectorAll("a");
      links.forEach((link) => link.href = article.url);
      const imageLink = node.querySelector(".image-link");
      const image = node.querySelector(".article-image");
      if (article.image) {
        imageLink?.style.setProperty("--article-image", `url("${article.image.replace(/"/g, "%22")}")`);
        image.src = article.image;
        image.alt = article.title;
        image.onload = () => {
          const ratio = image.naturalWidth / Math.max(image.naturalHeight, 1);
          const tiny = image.naturalWidth < 420 || image.naturalHeight < 220;
          const extreme = ratio > 2.35 || ratio < 0.62;
          imageLink?.classList.toggle("image-weird", tiny || extreme);
          imageLink?.classList.remove("image-broken");
        };
        image.onerror = () => {
          imageLink?.classList.add("image-broken", "image-weird");
        };
      } else {
        node.classList.add("text-only");
        image?.removeAttribute("src");
        image?.removeAttribute("alt");
      }
      node.querySelector(".source").textContent = article.source;
      node.querySelector(".headline").textContent = article.title;
      node.querySelector(".tag").textContent = article.category;
      node.querySelector(".tag").className = `tag rounded-md px-3 py-2 font-bold ${article.color}`;
      node.querySelector(".date").textContent = `${article.date}  •  ${article.time}`;
      const summary = node.querySelector(".summary");
      if (summary) summary.textContent = article.summary;
    }

    function render(filter = "home") {
      const isHome = filter === "home";
      const theme = newsletterData.themes.find((item) => item.id === filter);
      const selected = isHome ? newsletterData.home : theme?.articles ?? [];

      const visible = isHome ? selected.slice(0, 5) : selected;
      articlesEl.innerHTML = "";
      articlesEl.className = isHome
        ? "grid paper-grid gap-4 lg:gap-5"
        : "grid gap-4 md:grid-cols-2";

      if (!visible.length) {
        articlesEl.innerHTML = '<div class="article-card rounded-lg border border-[#111827]/12 p-8 text-lg font-semibold text-[#667085]">No articles in this section yet.</div>';
        return;
      }

      visible.forEach((article, index) => {
        const template = isHome && index === 0 ? leadTemplate : smallTemplate;
        const node = template.content.cloneNode(true).firstElementChild;
        applyArticle(node, article);

        if (isHome && index === 0) node.classList.add("lg:row-span-2");
        articlesEl.appendChild(node);
      });

      kicker.textContent = isHome ? "Home" : theme?.label ?? filter;
      count.textContent = isHome
        ? "A quiet front page for the links you actually want to open."
        : `${visible.length} article${visible.length === 1 ? "" : "s"} in this section.`;
    }

    function setActive(filter) {
      tabs.forEach((tab) => {
        const active = tab.dataset.filter === filter;
        if (tab.classList.contains("main-tab")) {
          tab.classList.toggle("active-tab", active);
          tab.classList.toggle("hover:bg-white/60", !active);
        } else {
          tab.classList.toggle("theme-active", active);
          tab.classList.toggle("active-tab", active && tab.closest("#mobile-menu"));
          tab.classList.toggle("hover:bg-white/60", !(active && tab.closest("#mobile-menu")));
        }
      });
    }

    function setMenuOpen(open) {
      if (!menuToggle || !mobileMenu) return;
      mobileMenu.classList.toggle("hidden", !open);
      menuToggle.classList.toggle("menu-open", open);
      menuToggle.setAttribute("aria-expanded", String(open));
      menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }

    menuToggle?.addEventListener("click", () => {
      setMenuOpen(menuToggle.getAttribute("aria-expanded") !== "true");
    });

    setupTabs();
    setActive("home");
    render("home");
  </script>
</body>
</html>
