<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Paper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            display: ["Playfair Display", "Georgia", "serif"]
          },
          boxShadow: {
            paper: "0 24px 80px rgba(61, 42, 28, 0.10)",
            card: "0 18px 44px rgba(61, 42, 28, 0.08)"
          }
        }
      }
    };
  </script>
  <style>
    body {
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 143, 108, .26), transparent 28rem),
        radial-gradient(circle at 76% 9%, rgba(255, 214, 118, .32), transparent 24rem),
        radial-gradient(circle at 88% 82%, rgba(122, 190, 255, .22), transparent 28rem),
        #f7f4ed;
    }

    .paper-grid {
      grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr);
    }

    .lead-card {
      grid-template-columns: minmax(280px, .98fr) minmax(260px, .82fr);
    }

    .article-card {
      background: linear-gradient(145deg, rgba(255, 253, 248, .94), rgba(255, 250, 241, .78));
    }

    .active-tab {
      background: linear-gradient(135deg, #ffb199, #ffe39a);
      color: #111111;
      box-shadow: 0 10px 26px rgba(255, 123, 84, .18);
    }

    .theme-active {
      color: #111111;
    }

    .theme-active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    #menu-toggle.menu-open .menu-line:nth-child(1) {
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
    }

    #menu-toggle.menu-open .menu-line:nth-child(2) {
      opacity: 0;
    }

    #menu-toggle.menu-open .menu-line:nth-child(3) {
      bottom: 50%;
      transform: translateY(50%) rotate(-45deg);
    }

    @media (max-width: 1024px) {
      .paper-grid,
      .lead-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="min-h-screen text-[#171717] antialiased">
  <header class="sticky top-0 z-30 border-b border-[#2f2418]/10 bg-[#f7f4ed]/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-[1360px] items-center gap-3 px-5 py-5 sm:gap-5 sm:px-8 lg:px-12">
      <a href="#" class="shrink-0 font-display text-2xl leading-none tracking-[-0.02em] sm:mr-4 sm:text-4xl">Personal Paper</a>

      <nav class="hidden items-center gap-4 md:flex" aria-label="Primary">
        <button class="main-tab active-tab rounded-lg px-6 py-3 text-base font-semibold transition" data-filter="home">Home</button>
        <button class="main-tab rounded-lg px-6 py-3 text-base font-semibold text-[#171717] transition hover:bg-white/60" data-filter="must">Must Read</button>
      </nav>

      <div class="hidden h-10 w-px bg-[#2f2418]/12 md:block"></div>

      <nav class="no-scrollbar -mx-5 hidden min-w-0 flex-1 items-center gap-3 overflow-x-auto px-5 md:mx-0 md:flex md:px-0" aria-label="Themes">
        <button class="theme-tab relative px-4 py-3 text-base font-semibold text-[#171717]/90 transition after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#ff795c] after:opacity-0 after:transition" data-filter="AI">AI</button>
        <button class="theme-tab relative px-4 py-3 text-base font-semibold text-[#171717]/90 transition hover:text-[#171717] after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#ff795c] after:opacity-0 after:transition" data-filter="Politics">Politics</button>
        <button class="theme-tab relative px-4 py-3 text-base font-semibold text-[#171717]/90 transition hover:text-[#171717] after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#ff795c] after:opacity-0 after:transition" data-filter="Football">Football</button>
        <button class="theme-tab relative px-4 py-3 text-base font-semibold text-[#171717]/90 transition hover:text-[#171717] after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#ff795c] after:opacity-0 after:transition" data-filter="France">France</button>
        <button class="theme-tab relative px-4 py-3 text-base font-semibold text-[#171717]/90 transition hover:text-[#171717] after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#ff795c] after:opacity-0 after:transition" data-filter="Algeria">Algeria</button>
      </nav>

      <button id="menu-toggle" class="ml-auto grid h-11 w-11 place-items-center rounded-lg border border-[#2f2418]/12 bg-white/50 text-[#171717] shadow-[0_10px_24px_rgba(61,42,28,.08)] md:hidden" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
        <span class="relative block h-4 w-5">
          <span class="menu-line absolute left-0 top-0 h-0.5 w-5 rounded-full bg-current transition"></span>
          <span class="menu-line absolute left-0 top-1/2 h-0.5 w-5 -translate-y-1/2 rounded-full bg-current transition"></span>
          <span class="menu-line absolute bottom-0 left-0 h-0.5 w-5 rounded-full bg-current transition"></span>
        </span>
      </button>
    </div>

    <div id="mobile-menu" class="hidden border-t border-[#2f2418]/10 bg-[#f7f4ed]/95 px-5 pb-5 pt-3 shadow-paper md:hidden">
      <nav class="grid grid-cols-2 gap-2" aria-label="Mobile navigation">
        <button class="main-tab active-tab rounded-lg px-4 py-3 text-left text-base font-semibold transition" data-filter="home">Home</button>
        <button class="main-tab rounded-lg px-4 py-3 text-left text-base font-semibold text-[#171717] transition hover:bg-white/60" data-filter="must">Must Read</button>
        <button class="theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#171717]/90 transition hover:bg-white/60" data-filter="AI">AI</button>
        <button class="theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#171717]/90 transition hover:bg-white/60" data-filter="Politics">Politics</button>
        <button class="theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#171717]/90 transition hover:bg-white/60" data-filter="Football">Football</button>
        <button class="theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#171717]/90 transition hover:bg-white/60" data-filter="France">France</button>
        <button class="theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#171717]/90 transition hover:bg-white/60" data-filter="Algeria">Algeria</button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-[1360px] px-5 py-10 sm:px-8 lg:px-12">
    <section class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
      <div>
        <p id="kicker" class="text-sm font-bold uppercase tracking-[0.18em] text-[#ee7257]">Home</p>
        <h1 class="mt-2 text-4xl font-black leading-[0.98] tracking-[-0.04em] sm:text-5xl">Five things worth reading now</h1>
      </div>
      <p id="count" class="max-w-sm text-sm font-medium leading-6 text-[#655f57]">A quiet front page for the links you actually want to open.</p>
    </section>

    <section id="articles" class="grid paper-grid gap-4 lg:gap-5" aria-live="polite"></section>
  </main>

  <template id="lead-template">
    <article class="article-card lead-card group grid overflow-hidden rounded-lg border border-[#2f2418]/12 shadow-paper transition hover:-translate-y-0.5 hover:shadow-card">
      <a class="image-link relative min-h-[340px] overflow-hidden bg-[#ebe5db]" href="#" target="_blank" rel="noreferrer">
        <img class="article-image h-full w-full object-cover transition duration-500 group-hover:scale-[1.025]" src="" alt="" loading="lazy">
        <div class="absolute inset-0 bg-gradient-to-r from-black/10 to-transparent"></div>
      </a>
      <div class="flex min-h-[340px] flex-col justify-center p-7 sm:p-9">
        <a class="source mb-12 truncate text-base font-medium text-[#67615b] hover:text-[#171717]" href="#" target="_blank" rel="noreferrer"></a>
        <a class="headline text-4xl font-black leading-[1.08] tracking-[-0.055em] text-[#090909] transition hover:text-[#f15f43] sm:text-5xl" href="#" target="_blank" rel="noreferrer"></a>
        <p class="summary mt-6 text-lg font-medium leading-8 text-[#625d56]"></p>
        <div class="mt-8 flex flex-wrap items-center gap-4 text-sm font-medium text-[#625d56]">
          <span class="tag rounded-md px-3 py-2 font-bold"></span>
          <span class="date"></span>
        </div>
      </div>
    </article>
  </template>

  <template id="small-template">
    <article class="article-card group grid gap-6 overflow-hidden rounded-lg border border-[#2f2418]/12 p-5 shadow-card transition hover:-translate-y-0.5 md:grid-cols-[minmax(180px,0.95fr)_minmax(190px,1fr)]">
      <a class="image-link block aspect-[16/10] overflow-hidden rounded-md bg-[#ebe5db]" href="#" target="_blank" rel="noreferrer">
        <img class="article-image h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]" src="" alt="" loading="lazy">
      </a>
      <div class="flex flex-col justify-center">
        <a class="source mb-5 truncate text-sm font-medium text-[#67615b] hover:text-[#171717]" href="#" target="_blank" rel="noreferrer"></a>
        <a class="headline text-2xl font-black leading-[1.12] tracking-[-0.035em] transition hover:text-[#f15f43]" href="#" target="_blank" rel="noreferrer"></a>
        <div class="mt-6 flex flex-wrap items-center gap-3 text-sm font-medium text-[#625d56]">
          <span class="tag rounded-md px-3 py-2 font-bold"></span>
          <span class="date"></span>
        </div>
      </div>
    </article>
  </template>

  <script>
    const articles = [
      {
        title: "Inside OpenAI's push to build useful AI agents",
        summary: "From task automation to digital assistants, OpenAI is betting its next wave of products on agents that can work for you.",
        url: "https://wired.com/story/openai-agents",
        source: "wired.com/story/openai-agents",
        category: "AI",
        date: "May 19, 2024",
        time: "8 min ago",
        mustRead: true,
        color: "bg-[#ffe4d9] text-[#f05f3e]",
        image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1200&q=80"
      },
      {
        title: "Attal faces doubts as France's political deadlock continues",
        summary: "France's political center searches for a path through another week of negotiations.",
        url: "https://lemonde.fr/politique/attal-deadlock",
        source: "lemonde.fr/politique/...",
        category: "Politics",
        date: "May 18, 2024",
        time: "2 hr ago",
        mustRead: true,
        color: "bg-[#ffe0df] text-[#e94f4f]",
        image: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "Algeria's economic reforms face a tough test",
        summary: "A new policy package puts growth, employment, and public trust under pressure.",
        url: "https://france24.com/africa/algeria-reforms",
        source: "france24.com/africa/algeria...",
        category: "Algeria",
        date: "May 18, 2024",
        time: "4 hr ago",
        mustRead: false,
        color: "bg-[#e5f2d9] text-[#4d8b45]",
        image: "https://images.unsplash.com/photo-1566837497312-7be4fb1d5483?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "Real Madrid hold off late surge to win La Liga",
        summary: "A tense final spell ends with Madrid protecting the lead and extending their season's momentum.",
        url: "https://skysports.com/football/real-madrid-laliga",
        source: "skysports.com/football/...",
        category: "Football",
        date: "May 19, 2024",
        time: "1 hr ago",
        mustRead: false,
        color: "bg-[#eadcff] text-[#7d38e8]",
        image: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=80"
      },
      {
        title: "EU agrees on new migration pact after marathon talks",
        summary: "European leaders settle on a compromise after months of pressure across member states.",
        url: "https://reuters.com/world/europe/eu-migration-pact",
        source: "reuters.com/world/europe/...",
        category: "France",
        date: "May 17, 2024",
        time: "6 hr ago",
        mustRead: true,
        color: "bg-[#dceeff] text-[#1871d6]",
        image: "https://images.unsplash.com/photo-1569974498991-d3c12a504f95?auto=format&fit=crop&w=900&q=80"
      }
    ];

    const articlesEl = document.querySelector("#articles");
    const leadTemplate = document.querySelector("#lead-template");
    const smallTemplate = document.querySelector("#small-template");
    const kicker = document.querySelector("#kicker");
    const count = document.querySelector("#count");
    const tabs = [...document.querySelectorAll("[data-filter]")];
    const menuToggle = document.querySelector("#menu-toggle");
    const mobileMenu = document.querySelector("#mobile-menu");

    function applyArticle(node, article) {
      const links = node.querySelectorAll("a");
      links.forEach((link) => link.href = article.url);
      node.querySelector(".article-image").src = article.image;
      node.querySelector(".article-image").alt = article.title;
      node.querySelector(".source").textContent = article.source;
      node.querySelector(".headline").textContent = article.title;
      node.querySelector(".tag").textContent = article.category;
      node.querySelector(".tag").className = `tag rounded-md px-3 py-2 font-bold ${article.color}`;
      node.querySelector(".date").textContent = `${article.date}  •  ${article.time}`;
      const summary = node.querySelector(".summary");
      if (summary) summary.textContent = article.summary;
    }

    function render(filter = "home") {
      const isHome = filter === "home";
      const selected = isHome
        ? articles
        : filter === "must"
          ? articles.filter((article) => article.mustRead)
          : articles.filter((article) => article.category === filter);

      const visible = isHome ? selected.slice(0, 5) : selected;
      articlesEl.innerHTML = "";
      articlesEl.className = isHome
        ? "grid paper-grid gap-4 lg:gap-5"
        : "grid gap-4 md:grid-cols-2";

      if (!visible.length) {
        articlesEl.innerHTML = '<div class="article-card rounded-lg border border-[#2f2418]/12 p-8 text-lg font-semibold text-[#625d56]">No articles in this section yet.</div>';
        return;
      }

      visible.forEach((article, index) => {
        const template = isHome && index === 0 ? leadTemplate : smallTemplate;
        const node = template.content.cloneNode(true).firstElementChild;
        applyArticle(node, article);

        if (isHome && index === 0) node.classList.add("lg:row-span-2");
        articlesEl.appendChild(node);
      });

      kicker.textContent = isHome ? "Home" : filter === "must" ? "Must Read" : filter;
      count.textContent = isHome
        ? "A quiet front page for the links you actually want to open."
        : `${visible.length} article${visible.length === 1 ? "" : "s"} in this section.`;
    }

    function setActive(filter) {
      tabs.forEach((tab) => {
        const active = tab.dataset.filter === filter;
        if (tab.classList.contains("main-tab")) {
          tab.classList.toggle("active-tab", active);
          tab.classList.toggle("hover:bg-white/60", !active);
        } else {
          tab.classList.toggle("theme-active", active);
          tab.classList.toggle("active-tab", active && tab.closest("#mobile-menu"));
          tab.classList.toggle("hover:bg-white/60", !(active && tab.closest("#mobile-menu")));
        }
      });
    }

    function setMenuOpen(open) {
      if (!menuToggle || !mobileMenu) return;
      mobileMenu.classList.toggle("hidden", !open);
      menuToggle.classList.toggle("menu-open", open);
      menuToggle.setAttribute("aria-expanded", String(open));
      menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const filter = tab.dataset.filter;
        setActive(filter);
        render(filter);
        setMenuOpen(false);
      });
    });

    menuToggle?.addEventListener("click", () => {
      setMenuOpen(menuToggle.getAttribute("aria-expanded") !== "true");
    });

    setActive("home");
    render("home");
  </script>
</body>
</html>
