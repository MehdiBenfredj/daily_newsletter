    :root {

      --wash: #f4f1eb;
      --accent: #e94f37;
    }

    body {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .86), rgba(244, 241, 235, .92) 34rem),
        radial-gradient(circle at 16% 8%, rgba(233, 79, 55, .14), transparent 27rem),
        radial-gradient(circle at 86% 16%, rgba(28, 100, 242, .12), transparent 25rem),
        radial-gradient(circle at 70% 86%, rgba(20, 121, 95, .10), transparent 29rem),
        var(--wash);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(17, 24, 39, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 24, 39, .025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .55), transparent 75%);
    }

    .paper-grid {
      grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr);
    }

    .lead-card {
      grid-template-columns: 1fr;
    }

    .article-card {
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .96), rgba(251, 249, 245, .88));
      position: relative;
    }

    .article-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72);
    }

    .article-card:hover {
      border-color: rgba(233, 79, 55, .28);
    }

    .image-link {
      isolation: isolate;
      aspect-ratio: 16 / 10;
      display: block;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .72), rgba(232, 237, 244, .82));
    }

    .image-link::before {
      content: "";
      position: absolute;
      inset: -20px;
      z-index: 0;
      background-image: var(--article-image);
      background-position: center;
      background-size: cover;
      filter: blur(24px) saturate(1.04);
      opacity: 0;
      transform: scale(1.08);
      transition: opacity .2s ease;
    }

    .image-link::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(17, 24, 39, .10)),
        linear-gradient(135deg, rgba(255, 255, 255, .40), rgba(232, 237, 244, .34));
    }

    .image-link .article-image,
    .image-link > div {
      position: relative;
      z-index: 1;
    }

    .image-link.image-weird {
      display: grid;
      place-items: center;
      background: #e8edf4;
    }

    .image-link.image-weird::before {
      opacity: .48;
    }

    .image-link.image-weird .article-image {
      height: calc(100% - 28px);
      width: calc(100% - 28px);
      object-fit: contain;
      transform: none;
      border-radius: .5rem;
      box-shadow: 0 14px 32px rgba(17, 24, 39, .16);
    }

    .image-link.image-broken .article-image {
      display: none;
    }

    .active-tab {
      background: #111827;
      color: #ffffff;
      box-shadow: 0 12px 28px rgba(17, 24, 39, .16);
    }

    .theme-active {
      color: #111827;
    }

    .theme-active::after {
      opacity: 1;
      transform: translateX(-50%) scaleX(1);
    }

    .no-scrollbar {
      scrollbar-width: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .small-card {
      grid-template-columns: minmax(168px, .72fr) minmax(0, 1fr);
    }

    .article-card.text-only .image-link {
      display: none;
    }

    .lead-card.text-only {
      align-content: center;
    }

    .small-card.text-only {
      grid-template-columns: 1fr;
    }

    .small-card.text-only > div {
      padding-right: 0;
    }

    .small-card .image-link {
      aspect-ratio: 4 / 3;
    }

    .lead-card .image-link {
      aspect-ratio: 16 / 9;
    }

    #menu-toggle.menu-open .menu-line:nth-child(1) {
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
    }

    #menu-toggle.menu-open .menu-line:nth-child(2) {
      opacity: 0;
    }

    #menu-toggle.menu-open .menu-line:nth-child(3) {
      bottom: 50%;
      transform: translateY(50%) rotate(-45deg);
    }

    @media (max-width: 1024px) {
      .paper-grid,
      .lead-card,
      .small-card {
        grid-template-columns: 1fr;
      }

      .small-card .image-link {
        aspect-ratio: 16 / 10;
      }
    }

    @media (max-width: 768px) {
      .small-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    function createThemeButton(theme, mobile = false) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.filter = theme.id;
      button.textContent = theme.label;
      button.className = mobile
        ? "theme-tab relative rounded-lg px-4 py-3 text-left text-base font-semibold text-[#111827]/90 transition hover:bg-[#111827]/5"
        : "theme-tab relative px-4 py-3 text-sm font-semibold text-[#475467] transition hover:text-[#111827] after:absolute after:bottom-1 after:left-1/2 after:h-0.5 after:w-10 after:-translate-x-1/2 after:scale-x-0 after:rounded-full after:bg-[#e94f37] after:opacity-0 after:transition";
      return button;
    }

    function setupTabs() {
      newsletterData.themes.forEach((theme) => {
        themeTabs?.appendChild(createThemeButton(theme));
        mobileNav?.appendChild(createThemeButton(theme, true));
      });

      tabs = [...document.querySelectorAll("[data-filter]")];
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const filter = tab.dataset.filter;
          setActive(filter);
          render(filter);
          setMenuOpen(false);
        });
      });

    function applyArticle(node, article) {
      const links = node.querySelectorAll("a");
      links.forEach((link) => link.href = article.url);
      const imageLink = node.querySelector(".image-link");
      const image = node.querySelector(".article-image");
      if (article.image) {
        imageLink?.style.setProperty("--article-image", `url("${article.image.replace(/"/g, "%22")}")`);
        image.src = article.image;
        image.alt = article.title;
        image.onload = () => {
          const ratio = image.naturalWidth / Math.max(image.naturalHeight, 1);
          const tiny = image.naturalWidth < 420 || image.naturalHeight < 220;
          const extreme = ratio > 2.35 || ratio < 0.62;
          imageLink?.classList.toggle("image-weird", tiny || extreme);
          imageLink?.classList.remove("image-broken");
        };
        image.onerror = () => {
          imageLink?.classList.add("image-broken", "image-weird");
        };
      } else {
        node.classList.add("text-only");
        image?.removeAttribute("src");
        image?.removeAttribute("alt");
      }
      node.querySelector(".source").textContent = article.source;
      node.querySelector(".headline").textContent = article.title;
      node.querySelector(".tag").textContent = article.category;
      node.querySelector(".tag").className = `tag rounded-md px-3 py-2 font-bold ${article.color}`;
      node.querySelector(".date").textContent = `${article.date}  •  ${article.time}`;
      const summary = node.querySelector(".summary");
      if (summary) summary.textContent = article.summary;
    }

    function render(filter = "home") {
      const isHome = filter === "home";
      const theme = newsletterData.themes.find((item) => item.id === filter);
      const selected = isHome ? newsletterData.home : theme?.articles ?? [];

      const visible = isHome ? selected.slice(0, 5) : selected;
      articlesEl.innerHTML = "";
      articlesEl.className = isHome
        ? "grid paper-grid gap-4 lg:gap-5"
        : "grid gap-4 md:grid-cols-2";

      if (!visible.length) {
        articlesEl.innerHTML = '<div class="article-card rounded-lg border border-[#111827]/12 p-8 text-lg font-semibold text-[#667085]">No articles in this section yet.</div>';
        return;
      }

      visible.forEach((article, index) => {
        const template = isHome && index === 0 ? leadTemplate : smallTemplate;
        const node = template.content.cloneNode(true).firstElementChild;
        applyArticle(node, article);

        if (isHome && index === 0) node.classList.add("lg:row-span-2");
        articlesEl.appendChild(node);
      });

      kicker.textContent = isHome ? "Home" : theme?.label ?? filter;
      count.textContent = isHome
        ? "A quiet front page for the links you actually want to open."
        : `${visible.length} article${visible.length === 1 ? "" : "s"} in this section.`;
    }

    function setActive(filter) {
      tabs.forEach((tab) => {
        const active = tab.dataset.filter === filter;
        if (tab.classList.contains("main-tab")) {
          tab.classList.toggle("active-tab", active);
          tab.classList.toggle("hover:bg-white/60", !active);
        } else {
          tab.classList.toggle("theme-active", active);
          tab.classList.toggle("active-tab", active && tab.closest("#mobile-menu"));
          tab.classList.toggle("hover:bg-white/60", !(active && tab.closest("#mobile-menu")));
        }
      });
    }

    function setMenuOpen(open) {
      if (!menuToggle || !mobileMenu) return;
      mobileMenu.classList.toggle("hidden", !open);
      menuToggle.classList.toggle("menu-open", open);
      menuToggle.setAttribute("aria-expanded", String(open));
      menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }

    menuToggle?.addEventListener("click", () => {
      setMenuOpen(menuToggle.getAttribute("aria-expanded") !== "true");
    });

    setupTabs();
    setActive("home");
    render("home");
  </script>
</body>
</html>
